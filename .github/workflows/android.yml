name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.1" \
            "build-tools;36.0.0"

      - name: Build debug APK
        run: sh ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Wemaps-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  windows-launcher:
    name: Verify Windows Gradle launcher
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up test JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify automatic Java discovery from PATH
        shell: pwsh
        run: |
          Remove-Item Env:JAVA_HOME -ErrorAction SilentlyContinue
          Get-ChildItem Env: -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "JAVA_HOME_*" } |
            ForEach-Object { Remove-Item "Env:$($_.Name)" -ErrorAction SilentlyContinue }

          Write-Host "JAVA_HOME: $env:JAVA_HOME"
          Write-Host "Version-specific JAVA_HOME variables:"
          Get-ChildItem Env:JAVA_HOME* -ErrorAction SilentlyContinue | Format-Table -AutoSize
          Write-Host "PATH Java executable:"
          where.exe java.exe
          Write-Host "Resolved Java command:"
          Get-Command java.exe -ErrorAction Stop | Format-List Name,Path,Source,Definition
          java.exe -version
          javac.exe -version

          .\gradlew.bat --version
