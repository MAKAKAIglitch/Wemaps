name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Give every validation run its own group so a newer push cannot
# interrupt an Android build halfway through dependency or compiler checks.
concurrency:
  group: android-build-validation-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  assemble:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Windows build PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PowerShellFiles = @(Get-ChildItem windows-build -Filter '*.ps1' -File) + @(Get-Item gradlew.ps1)
          foreach ($file in $PowerShellFiles) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $details = ($parseErrors | ForEach-Object { '{0}: {1}' -f $_.Extent.StartLineNumber, $_.Message }) -join [Environment]::NewLine
              throw ('PowerShell syntax errors in ' + $file.Name + ':' + [Environment]::NewLine + $details)
            }
          }
          Write-Host 'Windows build PowerShell syntax check passed.'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.1" \
            "build-tools;36.0.0"

      - name: Build debug APK
        run: sh ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Wemaps-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  windows-launcher:
    name: Verify Windows Gradle launcher
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up test JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Smoke-test SDK metadata permission fallback
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP "wemaps-sdk-fallback-smoke"
          $fakeSdk = Join-Path $testRoot "existing-sdk"
          $fakeLocalAppData = Join-Path $testRoot "local-appdata"
          $fakeManagedSdk = Join-Path $fakeLocalAppData "Wemaps\AndroidSdk"
          $fakeState = Join-Path $testRoot "state"
          $managerDir = Join-Path $fakeSdk "cmdline-tools\test\bin"
          New-Item -ItemType Directory -Force -Path $managerDir, $fakeLocalAppData, $fakeState | Out-Null

          $env:ANDROID_SDK_ROOT = $fakeSdk
          $env:ANDROID_HOME = ""
          $env:LOCALAPPDATA = $fakeLocalAppData
          $env:WEMAPS_FAKE_MANAGED_SDK = $fakeManagedSdk
          $env:WEMAPS_FAKE_STATE = $fakeState
          Remove-Item Env:CI -ErrorAction SilentlyContinue

          $fakeManager = @'
          @echo off
          setlocal EnableExtensions
          echo(%*|findstr.exe /I /C:"--licenses" >nul
          if not errorlevel 1 exit /b 0
          if not exist "%WEMAPS_FAKE_STATE%\install-attempted" (
            > "%WEMAPS_FAKE_STATE%\install-attempted" echo first-attempt
            echo Warning: Failed to read or create install properties file.
            exit /b 1
          )
          if not exist "%WEMAPS_FAKE_MANAGED_SDK%\platforms\android-37.1" mkdir "%WEMAPS_FAKE_MANAGED_SDK%\platforms\android-37.1"
          if not exist "%WEMAPS_FAKE_MANAGED_SDK%\build-tools\36.0.0" mkdir "%WEMAPS_FAKE_MANAGED_SDK%\build-tools\36.0.0"
          > "%WEMAPS_FAKE_MANAGED_SDK%\platforms\android-37.1\android.jar" echo fake platform
          > "%WEMAPS_FAKE_MANAGED_SDK%\build-tools\36.0.0\aapt2.exe" echo fake aapt2
          > "%WEMAPS_FAKE_MANAGED_SDK%\build-tools\36.0.0\zipalign.exe" echo fake zipalign
          exit /b 0
          '@
          [System.IO.File]::WriteAllText(
            (Join-Path $managerDir "sdkmanager.bat"),
            $fakeManager,
            [System.Text.Encoding]::ASCII
          )

          $resultFile = Join-Path $env:RUNNER_TEMP "wemaps-sdk-fallback-result.txt"
          $output = & powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File "windows-build\ensure-android-sdk.ps1" -ResultFile $resultFile 2>&1 | Out-String
          $exitCode = $LASTEXITCODE
          Write-Host $output

          if ($exitCode -ne 0) {
            throw "SDK fallback smoke test exited with code $exitCode"
          }
          if (-not (Test-Path $resultFile)) {
            throw "SDK helper did not return its selected SDK path"
          }
          $resolvedSdk = [System.IO.File]::ReadAllText($resultFile).Trim()
          if ($resolvedSdk -ne $fakeManagedSdk) {
            throw "SDK helper did not retry in the Wemaps user-local SDK. Resolved: $resolvedSdk"
          }
          if (-not (Test-Path (Join-Path $fakeManagedSdk "platforms\android-37.1\android.jar"))) {
            throw "The fallback SDK platform was not installed"
          }
          if (-not (Test-Path (Join-Path $fakeManagedSdk "build-tools\36.0.0\aapt2.exe"))) {
            throw "The fallback SDK build tools were not installed"
          }
          Remove-Item $resultFile -Force
          Write-Host "SDK metadata permission fallback smoke test passed."


      - name: Verify automatic Java discovery from PATH
        shell: pwsh
        run: |
          Remove-Item Env:JAVA_HOME -ErrorAction SilentlyContinue
          Get-ChildItem Env: -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "JAVA_HOME_*" } |
            ForEach-Object { Remove-Item "Env:$($_.Name)" -ErrorAction SilentlyContinue }

          Write-Host "JAVA_HOME: $env:JAVA_HOME"
          Write-Host "Version-specific JAVA_HOME variables:"
          Get-ChildItem Env:JAVA_HOME* -ErrorAction SilentlyContinue | Format-Table -AutoSize
          Write-Host "PATH Java executable:"
          where.exe java.exe
          Write-Host "Resolved Java command:"
          Get-Command java.exe -ErrorAction Stop | Format-List Name,Path,Source,Definition
          java.exe -version
          javac.exe -version

          .\gradlew.bat --version

      - name: Smoke-test Windows APK builder with an existing project SDK path
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP "wemaps-builder-smoke"
          $fakeSdk = Join-Path $testRoot "android-sdk"
          $fakeProfile = Join-Path $testRoot "profile"
          $fakeAppData = Join-Path $testRoot "roaming"
          $fakeLocalAppData = Join-Path $testRoot "local"

          $env:USERPROFILE = $fakeProfile
          $env:APPDATA = $fakeAppData
          $env:LOCALAPPDATA = $fakeLocalAppData
          $env:ANDROID_HOME = ""
          $env:ANDROID_SDK_ROOT = ""
          $env:CI = "true"
          $env:WEMAPS_NO_PAUSE = "1"

          $probeProject = Join-Path $fakeProfile "AndroidStudioProjects\SdkProbe"
          $fakePlatform = Join-Path $fakeSdk "platforms\android-37.1"
          $fakeBuildTools = Join-Path $fakeSdk "build-tools\36.0.0"
          New-Item -ItemType Directory -Force -Path $fakePlatform, $fakeBuildTools, $probeProject, $fakeAppData, $fakeLocalAppData | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $fakePlatform "android.jar"), "fake platform")
          [System.IO.File]::WriteAllText((Join-Path $fakeBuildTools "aapt2.exe"), "fake aapt2")
          [System.IO.File]::WriteAllText((Join-Path $fakeBuildTools "zipalign.exe"), "fake zipalign")
          $sdkForProperties = $fakeSdk.Replace('\', '/')
          Set-Content -Path (Join-Path $probeProject "local.properties") -Value "sdk.dir=$sdkForProperties" -Encoding ascii

          $env:PATH = (($env:PATH -split ';') | Where-Object {
            $_ -notlike '*\platform-tools' -and $_ -notlike '*\cmdline-tools\*\bin'
          }) -join ';'

          # Regression test: PATH may retain a stale entry for an unplugged drive.
          $env:JAVA_HOME = ""
          $occupiedDrives = [System.IO.Directory]::GetLogicalDrives()
          $missingDrive = [char[]](65..90) | Where-Object {
            $occupiedDrives -notcontains ("$_" + ":\")
          } | Select-Object -First 1
          if (-not $missingDrive) { throw "Could not find an unused drive letter for stale-PATH regression test." }
          $stalePathEntry = "$missingDrive" + ":\stale-jdk\bin"
          $env:PATH = "$stalePathEntry;$env:PATH"
          Write-Host "Testing Java discovery with an unavailable drive in PATH: $stalePathEntry"

          $wrapperPath = Join-Path $env:GITHUB_WORKSPACE "gradlew.bat"
          $originalWrapper = [System.IO.File]::ReadAllText($wrapperPath)
          $apkDirectory = Join-Path $env:GITHUB_WORKSPACE "app\build\outputs\apk\debug"
          $fakeApk = Join-Path $apkDirectory "app-debug.apk"

          try {
            [System.IO.File]::WriteAllText($wrapperPath, "@echo off" + [Environment]::NewLine + "exit /b 0" + [Environment]::NewLine, [System.Text.Encoding]::ASCII)
            New-Item -ItemType Directory -Force -Path $apkDirectory | Out-Null
            [System.IO.File]::WriteAllText($fakeApk, "Wemaps Windows builder smoke test", [System.Text.Encoding]::ASCII)

            $output = & cmd.exe /d /c build-windows.bat 2>&1 | Out-String
            $exitCode = $LASTEXITCODE
            Write-Host $output

            if ($exitCode -ne 0) {
              throw "build-windows.bat exited with code $exitCode"
            }
            if ($output -notmatch [regex]::Escape($fakeSdk)) {
              throw "SDK path from another project's local.properties was not detected"
            }
            $expectedSdkLine = "sdk.dir=" + $fakeSdk.Replace('\', '\\')
            $actualSdkLine = Get-Content "local.properties" |
              Where-Object { $_ -match '^\s*sdk\.dir\s*=' } |
              Select-Object -First 1
            if ($actualSdkLine -ne $expectedSdkLine) {
              throw "The builder did not persist the resolved SDK path into local.properties"
            }
            $builtApk = Join-Path "dist" "Wemaps-debug.apk"
            if (-not (Test-Path $builtApk)) {
              throw "The builder did not copy the APK into dist"
            }
            if ((Get-Content $builtApk -Raw) -ne "Wemaps Windows builder smoke test") {
              throw "The copied APK content does not match the test APK"
            }

            Write-Host "Windows APK builder smoke test passed."
          }
          finally {
            [System.IO.File]::WriteAllText($wrapperPath, $originalWrapper, [System.Text.Encoding]::ASCII)
          }
