name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Give every validation run its own group so a newer push cannot
# interrupt an Android build halfway through dependency or compiler checks.
concurrency:
  group: android-build-validation-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  assemble:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Validate Windows build PowerShell syntax
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($file in (Get-ChildItem windows-build -Filter '*.ps1' -File)) {
            $tokens = $null
            $parseErrors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$parseErrors)
            if ($parseErrors.Count -gt 0) {
              $details = ($parseErrors | ForEach-Object { '{0}: {1}' -f $_.Extent.StartLineNumber, $_.Message }) -join [Environment]::NewLine
              throw ('PowerShell syntax errors in ' + $file.Name + ':' + [Environment]::NewLine + $details)
            }
          }
          Write-Host 'Windows build PowerShell syntax check passed.'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install required Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-37.1" \
            "build-tools;36.0.0"

      - name: Build debug APK
        run: sh ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: Wemaps-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  windows-launcher:
    name: Verify Windows Gradle launcher
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up test JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify automatic Java discovery from PATH
        shell: pwsh
        run: |
          Remove-Item Env:JAVA_HOME -ErrorAction SilentlyContinue
          Get-ChildItem Env: -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like "JAVA_HOME_*" } |
            ForEach-Object { Remove-Item "Env:$($_.Name)" -ErrorAction SilentlyContinue }

          Write-Host "JAVA_HOME: $env:JAVA_HOME"
          Write-Host "Version-specific JAVA_HOME variables:"
          Get-ChildItem Env:JAVA_HOME* -ErrorAction SilentlyContinue | Format-Table -AutoSize
          Write-Host "PATH Java executable:"
          where.exe java.exe
          Write-Host "Resolved Java command:"
          Get-Command java.exe -ErrorAction Stop | Format-List Name,Path,Source,Definition
          java.exe -version
          javac.exe -version

          .\gradlew.bat --version

      - name: Smoke-test Windows APK builder with an existing project SDK path
        shell: pwsh
        run: |
          $testRoot = Join-Path $env:RUNNER_TEMP "wemaps-builder-smoke"
          $fakeSdk = Join-Path $testRoot "android-sdk"
          $fakeProfile = Join-Path $testRoot "profile"
          $fakeAppData = Join-Path $testRoot "roaming"
          $fakeLocalAppData = Join-Path $testRoot "local"

          $env:USERPROFILE = $fakeProfile
          $env:APPDATA = $fakeAppData
          $env:LOCALAPPDATA = $fakeLocalAppData
          $env:ANDROID_HOME = ""
          $env:ANDROID_SDK_ROOT = ""
          $env:CI = "true"

          $probeProject = Join-Path $fakeProfile "AndroidStudioProjects\SdkProbe"
          $fakePlatform = Join-Path $fakeSdk "platforms\android-37.1"
          $fakeBuildTools = Join-Path $fakeSdk "build-tools\36.0.0"
          New-Item -ItemType Directory -Force -Path $fakePlatform, $fakeBuildTools, $probeProject, $fakeAppData, $fakeLocalAppData | Out-Null
          [System.IO.File]::WriteAllText((Join-Path $fakePlatform "android.jar"), "fake platform")
          [System.IO.File]::WriteAllText((Join-Path $fakeBuildTools "aapt2.exe"), "fake aapt2")
          [System.IO.File]::WriteAllText((Join-Path $fakeBuildTools "zipalign.exe"), "fake zipalign")
          $sdkForProperties = $fakeSdk.Replace('\', '/')
          Set-Content -Path (Join-Path $probeProject "local.properties") -Value "sdk.dir=$sdkForProperties" -Encoding ascii

          $env:PATH = (($env:PATH -split ';') | Where-Object {
            $_ -notlike '*\platform-tools' -and $_ -notlike '*\cmdline-tools\*\bin'
          }) -join ';'

          # Regression test: PATH may retain a stale entry for an unplugged drive.
          $env:JAVA_HOME = ""
          $occupiedDrives = [System.IO.Directory]::GetLogicalDrives()
          $missingDrive = [char[]](65..90) | Where-Object {
            $occupiedDrives -notcontains ("$_" + ":\")
          } | Select-Object -First 1
          if (-not $missingDrive) { throw "Could not find an unused drive letter for stale-PATH regression test." }
          $stalePathEntry = "$missingDrive" + ":\stale-jdk\bin"
          $env:PATH = "$stalePathEntry;$env:PATH"
          Write-Host "Testing Java discovery with an unavailable drive in PATH: $stalePathEntry"

          $wrapperPath = Join-Path $env:GITHUB_WORKSPACE "gradlew.bat"
          $originalWrapper = [System.IO.File]::ReadAllText($wrapperPath)
          $apkDirectory = Join-Path $env:GITHUB_WORKSPACE "app\build\outputs\apk\debug"
          $fakeApk = Join-Path $apkDirectory "app-debug.apk"

          try {
            [System.IO.File]::WriteAllText($wrapperPath, "@echo off" + [Environment]::NewLine + "exit /b 0" + [Environment]::NewLine, [System.Text.Encoding]::ASCII)
            New-Item -ItemType Directory -Force -Path $apkDirectory | Out-Null
            [System.IO.File]::WriteAllText($fakeApk, "Wemaps Windows builder smoke test", [System.Text.Encoding]::ASCII)

            $output = & cmd.exe /d /c build-windows.bat 2>&1 | Out-String
            $exitCode = $LASTEXITCODE
            Write-Host $output

            if ($exitCode -ne 0) {
              throw "build-windows.bat exited with code $exitCode"
            }
            if ($output -notmatch [regex]::Escape($fakeSdk)) {
              throw "SDK path from another project's local.properties was not detected"
            }
            if (-not (Test-Path "Wemaps-debug.apk")) {
              throw "The builder did not copy the APK into the project root"
            }
            if ((Get-Content "Wemaps-debug.apk" -Raw) -ne "Wemaps Windows builder smoke test") {
              throw "The copied APK content does not match the test APK"
            }

            Write-Host "Windows APK builder smoke test passed."
          }
          finally {
            [System.IO.File]::WriteAllText($wrapperPath, $originalWrapper, [System.Text.Encoding]::ASCII)
          }
